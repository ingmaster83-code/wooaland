---
layout: default
title: 동네 검색 - 땅값·상가 시세 찾기
description: 동네·시군구 이름으로 토지·상가·공장·단독주택 실거래가와 평당가를 검색하세요. 예) 삼성동, 평택시, 양평군
---

<div class="page-with-sidebar" style="margin-top:20px;">
<div class="side-main">
<div class="section">
  <nav class="breadcrumb"><a href="/">홈</a> <span>›</span> <span>검색</span></nav>
  <h1 style="font-size:1.6rem;font-weight:800;margin:20px 0 24px;">🔍 동네 검색</h1>

  <div class="search-wrap" style="max-width:100%;margin-bottom:24px;">
    <input type="text" id="searchInput" class="search-input"
           placeholder="예) 삼성동, 평택시, 양평군..."
           autocomplete="off" style="border:1px solid #E5E7EB;">
    <button class="search-btn" onclick="doSearch()">검색</button>
  </div>

  <p id="searchStatus" style="color:#6B7280;font-size:.87rem;margin-bottom:16px;">동네 이름이나 시군구 이름을 입력하세요. 결과에서 땅값·상가·공장·단독주택을 고를 수 있습니다.</p>
  <ul class="office-list" id="resultList"></ul>
</div>
</div>
<aside class="tool-sidebar"></aside>
</div>

<script>
let items = null;
(async () => {
  const resp = await fetch('/search_index.json');
  items = await resp.json();
  items.forEach(f => { f.h = (f.n + ' ' + f.l + ' ' + f.t).toLowerCase(); });
  document.getElementById('searchStatus').textContent = `총 ${items.length.toLocaleString()}개 지역 검색 가능`;
  const q = new URLSearchParams(location.search).get('q');
  if (q) { document.getElementById('searchInput').value = q; doSearch(); }
})();
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q || !items) return;
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  const results = [];
  for (const f of items) {
    if (toks.every(t => f.h.includes(t))) { results.push(f); if (results.length >= 100) break; }
  }
  document.getElementById('searchStatus').textContent = `"${q}" 검색 결과: ${results.length}${results.length >= 100 ? '+' : ''}개`;
  const list = document.getElementById('resultList');
  if (results.length === 0) { list.innerHTML = '<li style="grid-column:1/-1;color:#6B7280;">검색 결과가 없습니다.</li>'; return; }
  list.innerHTML = results.map(f => `<li><a href="${f.u}"><b>${esc(f.n)}</b><small>${esc(f.t)} · ${esc(f.l)}</small></a></li>`).join('');
}
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
